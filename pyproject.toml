[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pokerlab"
version = "0.1.0"
description = "A research-oriented No-Limit Texas Hold'em AI platform."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "streamlit>=1.40",
    "plotly>=5.20",
]

[project.scripts]
pokerlab-benchmark = "pokerlab.benchmark_cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"
