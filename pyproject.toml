[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pokerlab"
version = "0.1.0"
description = "A research-oriented No-Limit Texas Hold'em AI platform."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "streamlit>=1.40",
    "plotly>=5.20",
]

[project.scripts]
pokerlab-benchmark = "pokerlab.benchmark_cli:main"
pokerlab-nlhe-mccfr = "pokerlab.research.nlhe.experiments:main"
pokerlab-deep-cfr = "pokerlab.algorithms.deep_cfr.experiments:main"
pokerlab-deep-cfr-study = "pokerlab.algorithms.deep_cfr.study:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
deep-cfr = [
    "torch>=2.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 88
target-version = "py312"
